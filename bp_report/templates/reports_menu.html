<style>
    /* New Style: Clean Corporate / Primary Colors */
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap');

    body {
        font-family: 'Roboto', sans-serif;
        background: linear-gradient(135deg, #E6F0F9 0%, #F5F8FA 100%);
        color: #333333;
        margin: 0;
        padding: 50px 0;
        display: flex;
        justify-content: center;
        min-height: 100vh;
        align-items: center;
    }

    .container {
        background: #FFFFFF;
        width: 400px;
        padding: 40px 30px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        text-align: center;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        border-top: 5px solid #C49B00; /* Gold accent */
    }

    .container:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    h2 {
        font-size: 2.2rem;
        color: #C49B00; /* Gold */
        margin-bottom: 30px;
        letter-spacing: 1.5px;
        font-weight: 900;
        text-transform: uppercase;
        border-bottom: 2px solid #1976D2; /* Blue underline */
        padding-bottom: 10px;
    }

    .report-types {
        list-style: none;
        padding: 0;
        margin-bottom: 35px;
    }

    .report-types li {
        margin: 15px 0;
    }

    .btn {
        display: inline-block;
        width: 100%;
        padding: 14px 0;
        border-radius: 8px; /* Square corners for simplicity */
        font-weight: 700;
        font-size: 1.1rem;
        color: white;
        background: #1976D2; /* Blue */
        text-decoration: none;
        box-shadow: 0 4px 10px rgba(25, 118, 210, 0.4);
        transition: all 0.3s ease;
        cursor: pointer;
        user-select: none;
        letter-spacing: 0.5px;
        border: 2px solid #1976D2;
    }

    .btn:hover {
        background: #1565C0; /* Darker Blue */
        box-shadow: 0 6px 15px rgba(25, 118, 210, 0.6);
        transform: translateY(-2px);
    }

    /* Back button uses Gold accent */
    .btn-back {
        background: #C49B00; /* Gold */
        border: 2px solid #C49B00;
        box-shadow: 0 4px 10px rgba(196, 155, 0, 0.4);
        font-weight: 700;
        max-width: 100%;
        margin-top: 15px;
        padding: 12px 0;
    }

    .btn-back:hover {
        background: #A08000;
        box-shadow: 0 6px 15px rgba(160, 128, 0, 0.6);
        transform: translateY(-2px);
    }
</style>

<body>
  <div class="container">
    <h2>Выберите тип отчёта</h2>
    <ul class="report-types">
      <li><a href="{{ url_for('bp_report.report_action_menu', report_type='sell') }}" class="btn">Отчёт по реальным продажам</a></li>
      <li><a href="{{ url_for('bp_report.report_action_menu', report_type='avance') }}" class="btn">Отчёт по плановым продажам</a></li>
    </ul>
    <a href="/menu" class="btn btn-back">На главную</a>
  </div>
</body>
