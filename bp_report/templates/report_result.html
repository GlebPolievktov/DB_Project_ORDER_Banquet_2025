<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Результаты отчёта</title>
    <style>
        /* New Style: Clean Corporate / Primary Colors */
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap');

        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 50px 0;
            background: linear-gradient(135deg, #E6F0F9 0%, #F5F8FA 100%);
            color: #333333;
            min-height: 100vh;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #FFFFFF;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease-in-out;
            border: 2px solid #C49B00; /* Gold frame */
        }
        .container:hover {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transform: translateY(-1px);
        }
        h2 {
            color: #C49B00; /* Gold title */
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
            font-weight: 900;
            border-bottom: 2px solid #1976D2; /* Blue underline */
            padding-bottom: 10px;
            font-size: 2.2rem;
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px; /* Spacing between rows */
            margin-bottom: 30px;
            font-size: 1rem;
        }
        thead tr th {
            background: #1976D2; /* Blue header */
            color: #ffffff;
            padding: 15px 20px;
            text-align: left;
            font-weight: 700;
            letter-spacing: 0.05em;
            border-radius: 6px 6px 0 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        tbody tr {
            background: #fdfdfd;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            border-radius: 8px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }
        tbody tr:hover {
            background: #eff3f7; /* Very light blue on hover */
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(25, 118, 210, 0.2);
        }
        tbody tr td {
            padding: 14px 20px;
            color: #333;
            border-left: 5px solid transparent;
            transition: border-left-color 0.3s ease;
        }
        tbody tr:hover td:first-child {
            border-left-color: #C49B00; /* Gold accent on hover */
        }

        .text-center {
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .btn-back {
            display: inline-block;
            padding: 12px 25px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            letter-spacing: 0.5px;
        }
        /* Button 1: To Reports (Red - Primary Action) */
        .text-center .btn-back:nth-child(1) {
            background: #D32F2F;
            box-shadow: 0 4px 10px rgba(211, 47, 47, 0.4);
        }
        .text-center .btn-back:nth-child(1):hover {
            background: #B71C1C;
            box-shadow: 0 6px 15px rgba(211, 47, 47, 0.6);
            transform: scale(1.02);
        }
        /* Button 2: To Menu (Blue - Secondary Navigation) */
        .text-center .btn-back:nth-child(2) {
            background: #1976D2;
            box-shadow: 0 4px 10px rgba(25, 118, 210, 0.4);
        }
        .text-center .btn-back:nth-child(2):hover {
            background: #1565C0;
            box-shadow: 0 6px 15px rgba(25, 118, 210, 0.6);
            transform: scale(1.02);
        }

        /* Адаптивность таблицы для узких экранов */
        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }
            table {
                border-spacing: 0;
            }
            thead { display: none; }
            tbody tr { margin-bottom: 15px; display: block; border: 1px solid #ddd; }
            tbody tr td { display: block; text-align: right; border: none; padding: 10px 15px; border-bottom: 1px dashed #eee; }
            tbody tr td:last-child { border-bottom: none; }
            tbody tr:hover td:first-child { border-left: none; }
            tbody tr td:before {
                content: attr(data-label);
                float: left;
                font-weight: bold;
                text-transform: uppercase;
                color: #1976D2;
                margin-right: 10px;
                font-size: 0.9rem;
            }
            .text-center {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>{{report_title}}</h2>
        <table>
            <thead>
                <tr>
                    <th>Id менеджера</th>
                    <th>Год</th>
                    <th>Месяц</th>
                    <th>Кол-во заказов</th>
                    <th>Итоговая сумма заказов</th>
                </tr>
            </thead>
            <tbody>
            {% for report in reports %}
                <tr>
                    <td data-label="Id менеджера">{{report[0]}}</td>
                    <td data-label="Год">{{report[1]}}</td>
                    <td data-label="Месяц">{{report[2]}}</td>
                    <td data-label="Кол-во заказов">{{report[3]}}</td>
                    <td data-label="Итоговая сумма заказов">{{report[4]}}</td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
        <div class="text-center">
            <a href="/reports" class="btn-back">К отчётам</a>
            <a href="/menu" class="btn-back">На главную</a>
        </div>
    </div>
</body>
</html>
