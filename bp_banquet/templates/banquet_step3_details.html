<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ банкета - Шаг 3</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1976D2 0%, #42A5F5 50%, #FFECB3 100%); /* Голубой с золотистым акцентом */
            margin: 0;
            padding: 40px 20px;
            color: #1A237E;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #ffffffdd;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
            padding: 40px;
        }
        h1 {
            text-align: center;
            color: #D32F2F; /* Красный */
            margin-bottom: 10px;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .step-indicator {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        .error {
            background: #FFEBEE;
            color: #C62828;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1976D2; /* Голубой */
        }
        input[type="date"],
        input[type="time"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #1976D288;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        input:focus, select:focus {
            border-color: #FFC107; /* Золотой фокус */
            outline: none;
            box-shadow: 0 0 8px rgba(255, 193, 7, 0.6);
        }
        .btn-submit {
            display: block;
            width: 100%;
            padding: 16px 0;
            background: linear-gradient(90deg, #D32F2F, #FF5252); /* Красный градиент */
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(211, 47, 47, 0.5);
            transition: all 0.3s ease;
            margin-top: 30px;
        }
        .btn-submit:hover {
            background: linear-gradient(90deg, #B71C1C, #D32F2F);
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(183, 28, 28, 0.7);
        }
        .btn-back {
            display: inline-block;
            text-align: center;
            width: 100%;
            background: #1976D2; /* Голубой */
            color: #fff;
            text-decoration: none;
            padding: 12px 0;
            margin-top: 20px;
            border-radius: 30px;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(25, 118, 210, 0.4);
            transition: all 0.3s ease;
        }
        .btn-back:hover {
            background: #0D47A1;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Детали Банкета</h1>
        <div class="step-indicator">Шаг 3 из 4: Дата, Время и Менеджер</div>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form action="/banquet/step3" method="POST">
            <div class="form-group">
                <label for="order_date">Дата банкета:</label>
                <input type="date" name="order_date" id="order_date" required min="{{ today }}" value="{{ order_date }}">
            </div>

            <div class="form-group">
                <label for="order_time">Время начала:</label>
                <input type="time" name="order_time" id="order_time" required value="{{ order_time }}">
            </div>

            <div class="form-group">
                <label for="manager_id">Выбор менеджера:</label>
                <select name="manager_id" id="manager_id" required>
                    <option value="">-- Выберите менеджера --</option>
                    {% for manager in managers %}
                        <option value="{{ manager[0] }}" {% if manager[0]|string == manager_id|string %}selected{% endif %}>
                            {{ manager[1] }} (ID: {{ manager[0] }})
                        </option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn-submit">Перейти к выбору меню</button>
        </form>

        <a href="/banquet/step2" class="btn-back">Назад к выбору зала</a>
    </div>
</body>
</html>
