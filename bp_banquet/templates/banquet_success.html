<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ успешно оформлен</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #42A5F5 0%, #FFECB3 100%); /* Голубой с золотистым акцентом */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1A237E;
        }
        .container {
            background: #ffffffdd;
            padding: 50px 60px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            animation: fadeScaleIn 0.7s ease forwards;
        }
        @keyframes fadeScaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        .success-icon {
            font-size: 80px;
            color: #FFC107; /* Золотой */
            margin-bottom: 20px;
            animation: bounce 0.6s ease;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        h1 {
            color: #1976D2; /* Голубой */
            margin-bottom: 20px;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .message {
            font-size: 1.2rem;
            color: #1A237E;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(90deg, #D32F2F, #FF5252); /* Красный градиент */
            color: white;
            text-decoration: none;
            padding: 14px 35px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 6px 18px rgba(211, 47, 47, 0.5);
            transition: all 0.3s ease;
            margin: 10px;
        }
        .btn:hover {
            background: linear-gradient(90deg, #B71C1C, #D32F2F);
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(183, 28, 28, 0.7);
        }
        .btn-secondary {
            background: linear-gradient(90deg, #1976D2, #42A5F5); /* Голубой градиент */
            box-shadow: 0 6px 18px rgba(25, 118, 210, 0.5);
        }
        .btn-secondary:hover {
            background: linear-gradient(90deg, #0D47A1, #1976D2);
            box-shadow: 0 10px 28px rgba(13, 71, 161, 0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="success-icon">✓</div>
        <h1>Заказ банкета успешен!</h1>
        <div class="message">
            Ваш заказ банкета успешно оформлен и сохранен в системе.
        </div>
        <a href="/banquet" class="btn">Сделать новый заказ</a>
        <a href="/menu" class="btn btn-secondary">На главную</a>
    </div>
</body>
</html>
