<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ банкета</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1976D2 0%, #42A5F5 100%); /* Голубой градиент */
            margin: 0;
            padding: 40px 20px;
            color: #1A237E;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);
            padding: 40px;
        }
        h1 {
            text-align: center;
            color: #D32F2F; /* Красный */
            margin-bottom: 30px;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .error {
            background: #FFEBEE;
            color: #C62828;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #C62828;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #1976D2; /* Голубой */
            font-size: 1.1rem;
        }
        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #1A237E88;
            border-radius: 10px;
            font-size: 1rem;
            color: #1A237E;
            box-sizing: border-box;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #FFC107; /* Золотой/Желтый фокус */
            box-shadow: 0 0 8px rgba(255, 193, 7, 0.6);
        }
        .menu-section {
            margin-top: 30px;
        }
        .menu-section h2 {
            color: #D32F2F; /* Красный */
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            margin-bottom: 15px;
            background: #FFFDE7; /* Светло-кремовый/Золотистый фон */
            border-radius: 10px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        .menu-item:hover {
            border-color: #FFC107; /* Золотой hover */
            background: #FFF9C4;
        }
        .menu-item-info {
            flex: 1;
        }
        .menu-item-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: #1A237E;
            margin-bottom: 5px;
        }
        .menu-item-price {
            color: #666;
            font-size: 0.95rem;
        }
        .menu-item-quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .menu-item-quantity input {
            width: 80px;
            padding: 8px;
            border: 2px solid #1976D288;
            border-radius: 8px;
            text-align: center;
        }
        .btn-submit {
            width: 100%;
            padding: 16px 0;
            background: linear-gradient(90deg, #D32F2F, #FF5252); /* Красный градиент */
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(211, 47, 47, 0.5);
            transition: all 0.3s ease;
            margin-top: 30px;
        }
        .btn-submit:hover {
            background: linear-gradient(90deg, #B71C1C, #D32F2F);
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(183, 28, 28, 0.7);
        }
        .btn-back {
            display: inline-block;
            background: #1976D2; /* Голубой */
            color: #fff;
            text-decoration: none;
            padding: 12px 30px;
            margin-top: 20px;
            border-radius: 30px;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(25, 118, 210, 0.4);
            transition: all 0.3s ease;
        }
        .btn-back:hover {
            background: #0D47A1;
            transform: scale(1.05);
        }
        .no-menu {
            text-align: center;
            padding: 40px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Заказ банкета</h1>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form action="/banquet/create" method="POST">
            <div class="form-group">
                <label for="number_of_people">Количество людей на банкете:</label>
                <input type="number" name="number_of_people" id="number_of_people"
                       min="1" required placeholder="Введите количество людей">
            </div>

            <div class="menu-section">
                <h2>Меню ресторана</h2>

                {% if menu_items %}
                    {% for item in menu_items %}
                    <div class="menu-item">
                        <div class="menu-item-info">
                            <div class="menu-item-name">{{ item[1] }}</div>
                            <div class="menu-item-price">Цена: {{ item[2] }} руб.</div>
                        </div>
                        <div class="menu-item-quantity">
                            <label for="menu_item_{{ item[0] }}_quantity">Количество:</label>
                            <input type="number"
                                   name="menu_item_{{ item[0] }}_quantity"
                                   id="menu_item_{{ item[0] }}_quantity"
                                   min="0" value="0">
                        </div>
                    </div>
                    {% endfor %}
                {% else %}
                    <div class="no-menu">
                        <p>Меню временно недоступно</p>
                    </div>
                {% endif %}
            </div>

            <button type="submit" class="btn-submit">Оформить заказ</button>
        </form>

        <a href="/menu" class="btn-back">На главную</a>
    </div>
</body>
</html>
