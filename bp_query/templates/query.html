<style>
    /*
     * Цветовая схема: Clean Corporate / Primary Colors
     * Фон: #E6F0F9 (Светлый Голубой)
     * Золотой акцент: #C49B00
     * Синий акцент: #1976D2
     * Красный акцент: #D32F2F (Для кнопки Submit)
     * Текст: #333333
     */
    body {
        font-family: 'Roboto', sans-serif;
        background: linear-gradient(135deg, #E6F0F9 0%, #F5F8FA 100%);
        margin: 0;
        padding: 50px 0;
        color: #333333;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .container {
        width: 90%;
        max-width: 500px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        padding: 40px;
        transition: box-shadow 0.3s ease;
        border: 2px solid #C49B00; /* Золотая рамка */
    }
    .container:hover {
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }
    h2 {
        text-align: center;
        margin-bottom: 40px;
        color: #C49B00; /* Золотой заголовок */
        text-transform: uppercase;
        letter-spacing: 2px;
        font-weight: 900;
        text-shadow: none;
        font-size: 2rem;
    }
    form {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }
    .form-group {
        display: flex;
        flex-direction: column;
    }
    label {
        font-weight: 700;
        margin-bottom: 8px;
        color: #1976D2; /* Синий лейбл */
        letter-spacing: 0.05em;
        font-size: 1.05rem;
    }
    input[type="text"],
    input[type="number"] {
        padding: 12px 15px;
        border: 1px solid #CCCCCC;
        border-radius: 6px;
        font-size: 1rem;
        color: #333333;
        outline: none;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    input[type="text"]:focus,
    input[type="number"]:focus {
        border-color: #1976D2; /* Синий фокус */
        box-shadow: 0 0 8px rgba(25, 118, 210, 0.3);
    }
    .price-range {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .price-range input {
        flex-grow: 1;
    }
    .price-range span {
        font-weight: 700;
        color: #1976D2;
        font-size: 1rem;
    }
    input[type="submit"] {
        background: #D32F2F; /* Красный фон для Submit */
        color: #ffffff;
        border: none;
        border-radius: 8px;
        padding: 15px 0;
        font-weight: 700;
        font-size: 1.1rem;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(211, 47, 47, 0.4);
        letter-spacing: 1px;
        transition: background 0.3s ease, transform 0.3s ease;
        margin-top: 20px;
    }
    input[type="submit"]:hover {
        background: #B71C1C;
        transform: scale(1.01);
    }
    .btn-back {
        display: inline-block;
        background: #1976D2; /* Синий фон */
        color: #ffffff;
        text-decoration: none;
        padding: 12px 20px;
        margin-top: 25px;
        border-radius: 8px;
        font-weight: 700;
        font-size: 0.95rem;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        transition: background 0.3s ease, transform 0.3s ease;
        letter-spacing: 0.5px;
        text-align: center;
    }
    .btn-back:hover {
        background: #1565C0;
        transform: scale(1.02);
    }
    @media (max-width: 500px) {
        .container {
            padding: 30px 20px;
        }
        .price-range {
            flex-direction: column;
            gap: 10px;
            align-items: stretch;
        }
        .price-range span {
            display: none;
        }
    }
</style>

<body>
    <div class="container">
        <h2>{{query_type_text}}</h2>
        <form action="/query/execute" method="POST">
            <input type="hidden" name="query_type" value="{{query_type}}">

            {% if query_type == 'category' %}
            <div class="form-group">
                <label for="prod_category">Фамилия менеджера </label>
                <input type="text" name="prod_category" id="prod_category" placeholder="Иванов" required>
            </div>
            {% elif query_type == 'price' %}
            <div class="form-group">
                <label>Диапазон цен (руб/кг)</label>
                <div class="price-range">
                    <input type="number" name="min_price" placeholder="Мин. цена" step="1" min="0" value="0" required>
                    <span>-</span>
                    <input type="number" name="max_price" placeholder="Макс. цена" step="1" min="0" value="50000" required>
                </div>
            </div>
            {% endif %}

            <input type="submit" value="Выполнить запрос">
        </form>
        <div style="display: flex; gap: 10px; margin-top: 25px;">
            <a href="/query" class="btn-back" style="flex-grow: 1;">Назад к выбору запросов</a>
            <a href="/menu" class="btn-back" style="flex-grow: 1;">На главную</a>
        </div>
    </div>
</body>
